[platformio]
default_envs = http

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
; Enable OPI PSRAM (ESP32-S3 N16R8 boards with 8MB OPI PSRAM).
; Without this, ps_malloc() returns nullptr and the firmware halts at startup.
; If your board has QPI PSRAM instead, change qio_opi to qio_qspi.
board_build.arduino.memory_type = qio_opi
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  links2004/WebSockets@^2.4.1
  ; Display (AXS15231B QSPI) — only linked in the waveshare env that #includes it.
  ; Pinned to 1.4.9: the last release that supports arduino-esp32 2.0.17 (our core).
  ; 1.5.0+ require esp32-hal-periman.h (core 3.x only) and fail to compile here.
  moononournation/GFX Library for Arduino@1.4.9

; M0 DIY board (INMP441 + MAX98357A) — Phase 0 (HTTP). Default env.
; Compiles main.cpp only (excludes the Waveshare M3 sources so setup()/loop() are not duplicated).
[env:http]
extends = common
build_src_filter = +<*> -<main_waveshare.cpp> -<es8311.cpp> -<display.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3

; M0/DIY — Phase 1 (WebSocket, xiaozhi-esp32-server).
; Requires M2 server at ws://<XIAOZHI_SERVER_HOST>:8003/xiaozhi/v1/
[env:ws]
extends = common
build_src_filter = +<*> -<main_waveshare.cpp> -<es8311.cpp> -<display.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -DUSE_WEBSOCKET=1

; M3 real board: Waveshare ESP32-S3-Touch-LCD-3.5B (N16R8, ES8311, OV5640).
; Compiles main_waveshare.cpp + es8311.cpp; excludes the M0 main.cpp.
[env:waveshare-s3-touch-lcd-35b]
extends = common
board_upload.flash_size = 16MB
build_src_filter = +<*> -<main.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; USB_MODE=1 routes Serial to the built-in USB-Serial/JTAG so logs show on the
  ; single USB-C port. Without it the monitor stays blank (confirmed on hardware).
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
