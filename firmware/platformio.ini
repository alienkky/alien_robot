# M0 DIY board (INMP441 + MAX98357A). Default env — compiles only main.cpp.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<main_waveshare.cpp> -<es8311.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  bblanchon/ArduinoJson@^7.2.1

# M3 real board: Waveshare ESP32-S3-Touch-LCD-3.5B (N16R8, ES8311, OV5640).
# Compiles main_waveshare.cpp + es8311.cpp; excludes the M0 main.cpp.
[env:waveshare-s3-touch-lcd-35b]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<main.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
