[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
; Enable OPI PSRAM (ESP32-S3-DevKitC-1-N16R8 and similar boards with 8MB OPI PSRAM).
; Without this, ps_malloc() returns nullptr and the firmware halts at startup.
; If your board has QPI PSRAM instead, change opi to qspi.
board_build.arduino.memory_type = qio_opi
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  links2004/WebSockets@^2.4.1

; Phase 0 (HTTP) — default build, upload with: pio run -e http -t upload
[env:http]
extends = common
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3

; Phase 1 (WebSocket, xiaozhi-esp32-server) — upload with: pio run -e ws -t upload
; Requires M2 server to be running at ws://<XIAOZHI_SERVER_HOST>:8003/xiaozhi/v1/
[env:ws]
extends = common
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -DUSE_WEBSOCKET=1
